<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My A-Frame Project</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
  <a-scene>

    <a-assets>
      <img id="floor" src="assets/images/floor.jpg">
      <a-asset-item id="robot" src="assets/models/robot.glb"></a-asset-item>
    </a-assets>

    <a-entity
      gltf-model="#robot"
      position="0 0 -4">
    </a-entity>

    <a-box
      position="0 1 -3"
      rotation="0 45 0"
      color="#4CC3D9">
    </a-box>

    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#7BC8A4">
    </a-plane>

    <a-sky color="#ECECEC"></a-sky>

  </a-scene>
</body>
</html>
